[package]
name = "maou-tui-ratatui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Maou CLI Ratatui backend"
license = "MIT"
publish = false

[[bin]]
name = "maou-tui-ratatui"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
anyhow = "1"
libc = "0.2"
# Safe lib swaps (parse / clipboard only — paint & OSC52 stay custom):
pulldown-cmark = "0.12"
base64 = "0.22"
# NOTE: do NOT depend on arboard. On macOS it links AppKit/Foundation and has been
# observed to hang the process in dyld / WindowServer (UE, never emit ready).
# Clipboard: OSC52 from Rust + Node pbcopy/xclip via protocol when needed.
