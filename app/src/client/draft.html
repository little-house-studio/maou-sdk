<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Maou UI 草稿</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <script>
      (function () {
        var ua = navigator.userAgent;
        if (!/Electron/i.test(ua)) return;
        var chrome = /Mac/i.test(ua)
          ? "darwin"
          : /Windows NT/i.test(ua)
            ? "win32"
            : /Linux/i.test(ua)
              ? "linux"
              : "";
        if (chrome) document.documentElement.dataset.appChrome = chrome;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main-draft.tsx"></script>
  </body>
</html>
