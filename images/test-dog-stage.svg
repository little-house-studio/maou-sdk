<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff8dc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="480" height="360" fill="url(#bg)"/>
  <!-- 聚光灯 -->
  <ellipse cx="240" cy="200" rx="160" ry="100" fill="url(#spot)"/>

  <!-- 帷幕 -->
  <path d="M0,0 Q40,80 0,160 L0,0 Z" fill="#8b0000"/>
  <path d="M480,0 Q440,80 480,160 L480,0 Z" fill="#8b0000"/>
  <path d="M0,0 Q120,40 240,20 Q360,40 480,0 L480,0 Z" fill="#a52a2a"/>

  <!-- 舞台 -->
  <ellipse cx="240" cy="280" rx="170" ry="36" fill="url(#stage)"/>
  <ellipse cx="240" cy="275" rx="160" ry="28" fill="#e8c547"/>
  <rect x="70" y="280" width="340" height="28" fill="#6b4f12"/>
  <text x="240" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#f5e6a8" opacity="0.85">★ STAGE ★</text>

  <!-- 小狗身体（侧面，抬后腿） -->
  <g transform="translate(200,200)">
    <!-- 身体 -->
    <ellipse cx="20" cy="28" rx="38" ry="22" fill="#d4a574"/>
    <!-- 胸口浅色 -->
    <ellipse cx="8" cy="30" rx="14" ry="12" fill="#f0d9b5"/>

    <!-- 前腿 -->
    <rect x="-8" y="40" width="10" height="22" rx="4" fill="#c4956a"/>
    <rect x="12" y="40" width="10" height="22" rx="4" fill="#c4956a"/>
    <ellipse cx="-3" cy="62" rx="7" ry="4" fill="#5c4033"/>
    <ellipse cx="17" cy="62" rx="7" ry="4" fill="#5c4033"/>

    <!-- 后腿（站立） -->
    <rect x="40" y="38" width="11" height="24" rx="4" fill="#c4956a"/>
    <ellipse cx="46" cy="62" rx="7" ry="4" fill="#5c4033"/>

    <!-- 抬起的后腿（撒尿姿势） -->
    <g transform="rotate(-55 48 36)">
      <rect x="42" y="20" width="10" height="26" rx="4" fill="#c4956a"/>
      <ellipse cx="47" cy="46" rx="6" ry="4" fill="#5c4033"/>
    </g>

    <!-- 尾巴 -->
    <path d="M55,18 Q72,0 68,22" fill="none" stroke="#d4a574" stroke-width="8" stroke-linecap="round"/>

    <!-- 头 -->
    <ellipse cx="-18" cy="12" rx="22" ry="20" fill="#d4a574"/>
    <!-- 耳朵 -->
    <ellipse cx="-32" cy="0" rx="10" ry="16" fill="#a67c52" transform="rotate(-20 -32 0)"/>
    <ellipse cx="-6" cy="-2" rx="9" ry="14" fill="#a67c52" transform="rotate(15 -6 -2)"/>
    <!-- 脸浅色 -->
    <ellipse cx="-20" cy="16" rx="12" ry="10" fill="#f0d9b5"/>
    <!-- 眼睛 -->
    <circle cx="-26" cy="10" r="3.5" fill="#2c1810"/>
    <circle cx="-14" cy="10" r="3.5" fill="#2c1810"/>
    <circle cx="-25" cy="9" r="1.2" fill="#fff"/>
    <circle cx="-13" cy="9" r="1.2" fill="#fff"/>
    <!-- 鼻子 -->
    <ellipse cx="-20" cy="18" rx="5" ry="3.5" fill="#2c1810"/>
    <!-- 微笑 -->
    <path d="M-26,22 Q-20,26 -14,22" fill="none" stroke="#5c4033" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 小水花（卡通） -->
    <g opacity="0.75">
      <path d="M48,42 Q52,50 50,58" fill="none" stroke="#7ec8e3" stroke-width="3" stroke-linecap="round"/>
      <path d="M50,58 Q48,62 52,66" fill="none" stroke="#7ec8e3" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="51" cy="70" r="2.5" fill="#7ec8e3"/>
      <circle cx="47" cy="74" r="1.8" fill="#a8dcef"/>
      <circle cx="55" cy="72" r="1.5" fill="#a8dcef"/>
    </g>
  </g>

  <!-- 舞台脚灯 -->
  <circle cx="120" cy="268" r="5" fill="#ff6b6b"/>
  <circle cx="180" cy="272" r="5" fill="#ffd93d"/>
  <circle cx="300" cy="272" r="5" fill="#6bcb77"/>
  <circle cx="360" cy="268" r="5" fill="#4d96ff"/>

  <text x="240" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8899aa">test SVG · dog on stage</text>
</svg>
