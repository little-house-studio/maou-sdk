<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="一只小狗在舞台上跳拉丁舞">
  <defs>
    <linearGradient id="stageFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2a1f"/>
      <stop offset="100%" stop-color="#1a100c"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b1020"/>
      <stop offset="45%" stop-color="#a01830"/>
      <stop offset="55%" stop-color="#a01830"/>
      <stop offset="100%" stop-color="#6b1020"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#fff6d0" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffd080" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c48a"/>
      <stop offset="100%" stop-color="#d9a05c"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      <![CDATA[
        .sway {
          transform-origin: 320px 300px;
          animation: sway 0.72s ease-in-out infinite alternate;
        }
        .hip {
          transform-origin: 320px 275px;
          animation: hip 0.36s ease-in-out infinite alternate;
        }
        .arm-l {
          transform-origin: 275px 230px;
          animation: armL 0.72s ease-in-out infinite alternate;
        }
        .arm-r {
          transform-origin: 365px 230px;
          animation: armR 0.72s ease-in-out infinite alternate;
        }
        .leg-l {
          transform-origin: 300px 300px;
          animation: legL 0.72s ease-in-out infinite alternate;
        }
        .leg-r {
          transform-origin: 340px 300px;
          animation: legR 0.72s ease-in-out infinite alternate;
        }
        .tail {
          transform-origin: 250px 255px;
          animation: tail 0.28s ease-in-out infinite alternate;
        }
        .spark {
          animation: twinkle 1.1s ease-in-out infinite;
        }
        .spark2 { animation-delay: 0.35s; }
        .spark3 { animation-delay: 0.7s; }
        .note {
          animation: floatNote 1.6s ease-in-out infinite;
        }
        .note2 { animation-delay: 0.5s; }
        .note3 { animation-delay: 1s; }

        @keyframes sway {
          from { transform: rotate(-7deg) translate(0, 0); }
          to   { transform: rotate(7deg) translate(0, -6px); }
        }
        @keyframes hip {
          from { transform: rotate(-10deg); }
          to   { transform: rotate(10deg); }
        }
        @keyframes armL {
          from { transform: rotate(25deg); }
          to   { transform: rotate(-50deg); }
        }
        @keyframes armR {
          from { transform: rotate(-20deg); }
          to   { transform: rotate(45deg); }
        }
        @keyframes legL {
          from { transform: rotate(18deg); }
          to   { transform: rotate(-12deg); }
        }
        @keyframes legR {
          from { transform: rotate(-16deg); }
          to   { transform: rotate(14deg); }
        }
        @keyframes tail {
          from { transform: rotate(-25deg); }
          to   { transform: rotate(35deg); }
        }
        @keyframes twinkle {
          0%, 100% { opacity: 0.2; transform: scale(0.7); }
          50% { opacity: 1; transform: scale(1.15); }
        }
        @keyframes floatNote {
          0% { opacity: 0; transform: translateY(8px); }
          30% { opacity: 1; }
          100% { opacity: 0; transform: translateY(-28px); }
        }
      ]]>
    </style>
  </defs>

  <!-- Backdrop -->
  <rect width="640" height="480" fill="#120a14"/>
  <rect x="0" y="0" width="640" height="300" fill="#1b0f1f"/>

  <!-- Curtains -->
  <path d="M0 0 H90 Q70 160 90 300 H0 Z" fill="url(#curtain)"/>
  <path d="M640 0 H550 Q570 160 550 300 H640 Z" fill="url(#curtain)"/>
  <path d="M0 0 H640 V48 Q320 90 0 48 Z" fill="#8b1428"/>
  <path d="M0 0 H640 V28" fill="#5c0c1a"/>

  <!-- Stage platform -->
  <ellipse cx="320" cy="390" rx="250" ry="42" fill="#2a1a12" opacity="0.85"/>
  <path d="M80 350 Q320 300 560 350 L540 400 Q320 450 100 400 Z" fill="url(#stageFloor)"/>
  <path d="M100 400 Q320 450 540 400 L540 418 Q320 470 100 418 Z" fill="#140c08"/>
  <!-- Stage edge lights -->
  <g fill="#ffcf5a">
    <circle cx="140" cy="392" r="5" opacity="0.9"/>
    <circle cx="200" cy="408" r="5" opacity="0.75"/>
    <circle cx="260" cy="416" r="5" opacity="0.9"/>
    <circle cx="320" cy="420" r="5" opacity="0.95"/>
    <circle cx="380" cy="416" r="5" opacity="0.9"/>
    <circle cx="440" cy="408" r="5" opacity="0.75"/>
    <circle cx="500" cy="392" r="5" opacity="0.9"/>
  </g>

  <!-- Spotlight -->
  <ellipse cx="320" cy="300" rx="160" ry="120" fill="url(#spot)"/>

  <!-- Music notes -->
  <g fill="#ffe08a" font-family="Georgia, serif" font-size="22">
    <text class="note" x="430" y="180">♪</text>
    <text class="note note2" x="460" y="200">♫</text>
    <text class="note note3" x="410" y="210">♩</text>
  </g>

  <!-- Sparks -->
  <g fill="#fff3b0">
    <circle class="spark" cx="250" cy="160" r="3"/>
    <circle class="spark spark2" cx="390" cy="150" r="2.5"/>
    <circle class="spark spark3" cx="320" cy="130" r="3.5"/>
    <circle class="spark spark2" cx="280" cy="145" r="2"/>
  </g>

  <!-- Dancing puppy group -->
  <g class="sway" filter="url(#softShadow)">
    <!-- Shadow on floor -->
    <ellipse cx="320" cy="360" rx="55" ry="12" fill="#000" opacity="0.35"/>

    <!-- Tail -->
    <g class="tail">
      <path d="M255 255 Q220 230 210 200" fill="none" stroke="#c9894a" stroke-width="12" stroke-linecap="round"/>
      <path d="M210 200 Q205 185 218 178" fill="none" stroke="#e8b56f" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- Back leg (right) -->
    <g class="leg-r">
      <path d="M340 300 L355 345 L365 345" fill="none" stroke="#c9894a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- shoe -->
      <ellipse cx="372" cy="348" rx="14" ry="7" fill="#1a1a1a"/>
      <path d="M360 345 Q375 335 385 348" fill="#c41e3a"/>
    </g>

    <!-- Front leg (left) -->
    <g class="leg-l">
      <path d="M300 300 L280 348 L268 348" fill="none" stroke="#c9894a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="260" cy="350" rx="14" ry="7" fill="#1a1a1a"/>
      <path d="M270 347 Q255 336 248 350" fill="#c41e3a"/>
    </g>

    <!-- Body + hips (Latin sway) -->
    <g class="hip">
      <!-- Torso -->
      <ellipse cx="320" cy="255" rx="48" ry="52" fill="url(#fur)"/>
      <!-- White chest -->
      <ellipse cx="325" cy="265" rx="22" ry="28" fill="#fff6e8" opacity="0.9"/>
      <!-- Ruffled Latin shirt / sash -->
      <path d="M285 230 Q320 245 355 230 L350 270 Q320 285 290 270 Z" fill="#c41e3a" opacity="0.92"/>
      <path d="M300 235 Q320 250 340 235" fill="none" stroke="#ffd76a" stroke-width="3"/>
      <circle cx="320" cy="248" r="4" fill="#ffd76a"/>
      <!-- Belt -->
      <rect x="292" y="278" width="56" height="8" rx="3" fill="#1a1a1a"/>
      <rect x="314" y="278" width="12" height="8" fill="#ffd76a"/>
    </g>

    <!-- Left arm up -->
    <g class="arm-l">
      <path d="M280 235 Q250 210 235 175" fill="none" stroke="#c9894a" stroke-width="12" stroke-linecap="round"/>
      <circle cx="232" cy="168" r="9" fill="#e8b56f"/>
      <!-- rose in paw -->
      <circle cx="220" cy="158" r="7" fill="#e11d48"/>
      <circle cx="228" cy="152" r="5" fill="#be123c"/>
      <path d="M224 164 L222 178" stroke="#166534" stroke-width="2"/>
    </g>

    <!-- Right arm extended -->
    <g class="arm-r">
      <path d="M360 235 Q400 250 430 270" fill="none" stroke="#c9894a" stroke-width="12" stroke-linecap="round"/>
      <circle cx="436" cy="274" r="9" fill="#e8b56f"/>
    </g>

    <!-- Head -->
    <g>
      <ellipse cx="320" cy="185" rx="42" ry="38" fill="url(#fur)"/>
      <!-- Ears -->
      <ellipse cx="285" cy="160" rx="14" ry="24" fill="#c9894a" transform="rotate(-20 285 160)"/>
      <ellipse cx="355" cy="160" rx="14" ry="24" fill="#c9894a" transform="rotate(20 355 160)"/>
      <ellipse cx="285" cy="162" rx="7" ry="14" fill="#f3c4c4" transform="rotate(-20 285 162)" opacity="0.8"/>
      <ellipse cx="355" cy="162" rx="7" ry="14" fill="#f3c4c4" transform="rotate(20 355 162)" opacity="0.8"/>
      <!-- Snout -->
      <ellipse cx="320" cy="200" rx="20" ry="15" fill="#fff6e8"/>
      <ellipse cx="320" cy="194" rx="8" ry="6" fill="#2a1a12"/>
      <!-- Eyes -->
      <ellipse cx="305" cy="180" rx="6" ry="7" fill="#1a1208"/>
      <ellipse cx="335" cy="180" rx="6" ry="7" fill="#1a1208"/>
      <circle cx="307" cy="178" r="2" fill="#fff"/>
      <circle cx="337" cy="178" r="2" fill="#fff"/>
      <!-- Blush -->
      <ellipse cx="292" cy="192" rx="7" ry="4" fill="#f5a0a0" opacity="0.55"/>
      <ellipse cx="348" cy="192" rx="7" ry="4" fill="#f5a0a0" opacity="0.55"/>
      <!-- Happy mouth -->
      <path d="M310 208 Q320 218 330 208" fill="none" stroke="#5a3a22" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Tiny mustache vibe for Latin flair -->
      <path d="M308 200 Q320 206 332 200" fill="none" stroke="#5a3a22" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- Tiny rose in ear / headband -->
    <g>
      <circle cx="350" cy="155" r="6" fill="#e11d48"/>
      <path d="M350 160 L352 170" stroke="#166534" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Stage label -->
  <text x="320" y="455" text-anchor="middle" font-family="Georgia, 'Songti SC', serif" font-size="16" fill="#e8c98a" opacity="0.85">
    拉丁小狗 · Latin Puppy Dance
  </text>
</svg>
